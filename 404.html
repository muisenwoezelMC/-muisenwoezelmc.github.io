<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pagina niet gevonden – Muisenwoezel</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#0c1a2e;color:#e8ecf2;font:400 18px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;text-align:center;padding:24px}
.b{width:72px;height:72px;margin:0 auto 24px;background:#e03a3a;box-shadow:inset -8px -8px 0 #8f1f1f,inset 8px 8px 0 #f27a7a;animation:f 2.4s ease-in-out infinite alternate}
@keyframes f{to{transform:translateY(-12px) rotate(8deg)}}
h1{margin:0 0 8px;font-size:clamp(28px,7vw,44px);line-height:1.1;text-wrap:balance}
p{margin:0 0 24px;color:#8d99ab;text-wrap:pretty}
a{display:inline-block;padding:13px 22px;background:#e03a3a;color:#fff;font-weight:600;text-decoration:none;box-shadow:inset -4px -4px 0 #8f1f1f,inset 4px 4px 0 #f27a7a}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.b{animation:none}}
</style>
</head>
<body>
<main>
<div class="b" aria-hidden="true"></div>
<h1>Deze pagina bestaat niet</h1>
<p>Het blok dat je zoekt is weg. Ga terug naar de hoofdpagina.</p>
<a href="/">Naar de hoofdpagina</a>
</main>
</body>
</html>
